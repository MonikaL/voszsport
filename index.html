<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOSZ Sport Program</title>
    
    <!-- Mobil App Beállítások -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VOSZ Sport">
    
    <!-- Favicon és App Ikon -->
    <link rel="apple-touch-icon" href="favicon.jpg">
    <link rel="icon" type="image/jpeg" href="favicon.jpg">

    <style>
        :root {
            /* Színek a logóból kinyerve */
            --vosz-logo-blue: #163e75;
            --vosz-logo-red: #d31d24;
            --vosz-logo-light-blue: #0093d7;
            --vosz-white: #ffffff;
            --vosz-bg-gray: #f2f5f8;
            
            --shadow-standard: 0 4px 12px rgba(0,0,0,0.12);
            --shadow-active: 0 8px 24px rgba(0,0,0,0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--vosz-bg-gray);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #1a1a1a;
        }

        /* Felső konténer: Logo balra, szöveg jobbra */
        .top-container {
            width: 100%;
            max-width: 500px;
            background-color: var(--vosz-white);
            display: flex;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            margin-bottom: 30px;
            border-bottom: 3px solid var(--vosz-logo-blue);
        }

        .top-container img {
            width: 90px;
            height: auto;
            margin-right: 20px;
            border-radius: 12px;
        }

        .welcome-text {
            flex: 1;
            font-weight: 800;
            font-size: 1.15rem;
            color: var(--vosz-logo-blue);
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .container {
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* Gombok alap stílusa */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 24px;
            background-color: var(--vosz-logo-blue);
            color: var(--vosz-white);
            text-decoration: none;
            border-radius: 18px;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: var(--shadow-standard);
            border: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }

        /* Hover effektus */
        .btn:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-active);
            filter: brightness(1.1);
        }

        /* Kiemelt gomb (Napi rögzítés) - A logó vörös színe */
        .btn-primary {
            background: linear-gradient(135deg, var(--vosz-logo-red) 0%, #b3161c 100%);
            font-size: 1.2rem;
            padding: 22px 24px;
        }

        /* Másodlagos gomb - A logó kékje */
        .btn-secondary {
            background: linear-gradient(135deg, var(--vosz-logo-blue) 0%, #0d2a52 100%);
        }

        /* Harmadlagos gomb - Világosabb kék */
        .btn-info {
            background: linear-gradient(135deg, var(--vosz-logo-light-blue) 0%, #007bb3 100%);
        }

        /* Aktív állapot (kattintáskor) */
        .btn:active {
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .footer {
            margin-top: auto;
            padding: 40px 20px;
            font-size: 0.9rem;
            color: #555;
            text-align: center;
            line-height: 1.5;
            background: rgba(255,255,255,0.5);
            width: 100%;
            box-sizing: border-box;
        }

        .footer strong {
            color: var(--vosz-logo-blue);
        }

        /* Iframe modal */
        #frame-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 1000;
        }

        .close-bar {
            height: 60px;
            background: var(--vosz-logo-blue);
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 15px;
        }

        .close-btn {
            background: var(--vosz-logo-red);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        iframe {
            width: 100%;
            height: calc(100% - 60px);
            border: none;
        }
    </style>
</head>
<body>

    <div class="top-container">
        <!-- Logo a feltöltött favicon.jpg alapján -->
        <img src="favicon.jpg" alt="VOSZ Logo">
        <div class="welcome-text">VOSZ Egészségmegőrzés Program</div>
    </div>

    <div class="container">
        <!-- 1. gomb: Napi tevékenység (Vörös) -->
        <a href="https://forms.gle/7mFBHxcDYXEcvqmA8" class="btn btn-primary">
            Napi tevékenység rögzítése
        </a>

        <!-- 2. gomb: Adatok megtekintése (Sötétkék) -->
        <a href="https://lookerstudio.google.com/s/kbh9jrd2oEU" target="_blank" class="btn btn-secondary">
            Adatok megtekintése
        </a>

        <!-- 3. gomb: Részvételi szabályok (Világoskék) -->
        <a href="szabalyzat.html" target="_blank" class="btn btn-info">
            Részvételi szabályok
        </a>
    </div>

    <div class="footer">
        <strong>VOSZ Sport Kihívás 2026</strong><br>
        2026. március 15. – 2026. november 30.
    </div>

    <div id="frame-container">
        <div class="close-bar">
            <button class="close-btn" onclick="closeFrame()">Bezárás</button>
        </div>
        <iframe id="app-frame" src=""></iframe>
    </div>

    <script>
        function openInApp(url) {
            document.getElementById('app-frame').src = url;
            document.getElementById('frame-container').style.display = 'block';
        }

        function closeFrame() {
            document.getElementById('frame-container').style.display = 'none';
            document.getElementById('app-frame').src = '';
        }
        
        // PWA navigációs kezelés
        if (("standalone" in window.navigator) && window.navigator.standalone) {
            document.addEventListener('click', function(event) {
                let noddy = event.target;
                while (noddy && noddy.nodeName !== "A" && noddy.nodeName !== "HTML") {
                    noddy = noddy.parentNode;
                }
                if (noddy && 'href' in noddy && noddy.href.indexOf('http') !== -1) {
                    // Külső linkek kezelése (Google Forms stb.)
                    if (noddy.href.indexOf('forms.gle') !== -1 || noddy.href.indexOf('lookerstudio') !== -1) {
                        // Ezeket hagyjuk alapértelmezetten nyílni vagy iframe-ben
                    } else {
                        event.preventDefault();
                        document.location.href = noddy.href;
                    }
                }
            }, false);
        }
    </script>
</body>
</html>
