<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>VOSZ Sport Program</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VOSZ Sport">
    
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        :root {
            --vosz-logo-blue: #163e75;
            --vosz-logo-red: #d31d24;
            --vosz-logo-light-blue: #0093d7;
            --vosz-white: #ffffff;
            --vosz-bg-gray: #f2f5f8;
            --shadow-standard: 0 4px 12px rgba(0,0,0,0.12);
            --shadow-active: 0 8px 24px rgba(0,0,0,0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--vosz-bg-gray);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #1a1a1a;
        }

        .top-container {
            width: 100%;
            max-width: 500px;
            background-color: var(--vosz-white);
            display: flex;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            margin-bottom: 30px;
            border-bottom: 3px solid var(--vosz-logo-blue);
        }

        .top-container img {
            width: 90px;
            height: auto;
            margin-right: 20px;
            border-radius: 12px;
        }

        .welcome-text {
            flex: 1;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--vosz-logo-blue);
            line-height: 1.3;
        }

        .container {
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 24px;
            background-color: var(--vosz-logo-blue);
            color: var(--vosz-white);
            text-decoration: none;
            border-radius: 18px;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: var(--shadow-standard);
            border: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-active);
            filter: brightness(1.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--vosz-logo-red) 0%, #b3161c 100%);
            font-size: 1.2rem;
            padding: 22px 24px;
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--vosz-logo-blue) 0%, #0d2a52 100%);
        }

        .btn-info {
            background: linear-gradient(135deg, var(--vosz-logo-light-blue) 0%, #007bb3 100%);
        }

        .footer {
            margin-top: auto;
            padding: 40px 20px;
            font-size: 0.9rem;
            color: #555;
            text-align: center;
            line-height: 1.5;
            background: rgba(255,255,255,0.5);
            width: 100%;
            box-sizing: border-box;
        }
        
        .developer-credit a {
            color: var(--vosz-logo-blue);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="top-container">
        <img src="favicon.png" alt="VOSZ Logo">
        <div class="welcome-text">Üdvözöljük a VOSZ Egészségmegőrzés Programban!</div>
    </div>

    <div class="container">
        <a href="https://forms.gle/7mFBHxcDYXEcvqmA8" class="btn btn-primary">
            Napi tevékenység rögzítése
        </a>

        <a href="https://lookerstudio.google.com/reporting/2e410f7b-c07b-4431-be01-7f5e9c096e18/page/FhOrF?v=2" target="_blank" class="btn btn-secondary">
            Adatok megtekintése
        </a>

        <a href="szabalyzat.html" target="_blank" class="btn btn-info">
            Részvételi szabályok
        </a>
    </div>

    <div class="footer">
        <strong>VOSZ Sport Kihívás 2026</strong><br>
        2026. március 15. – 2026. november 30.
        <div class="developer-credit">
            Készítette: <a href="https://www.linkedin.com/in/monika-lantos/" target="_blank">Lantos Mónika</a>
        </div>
    </div>

    <script>
        // KÉNYSZERÍTETT FRISSÍTÉS LOGIKA:
        // Megnézzük, futott-e már a frissítés ezen a verzión (v2)
        if (localStorage.getItem('app_version') !== '2.0') {
            localStorage.setItem('app_version', '2.0');
            // Töröljük a cache-t és újratöltünk
            window.location.reload(true);
        }

        // PWA navigációs kezelés
        if (("standalone" in window.navigator) && window.navigator.standalone) {
            document.addEventListener('click', function(event) {
                let noddy = event.target;
                while (noddy && noddy.nodeName !== "A" && noddy.nodeName !== "HTML") {
                    noddy = noddy.parentNode;
                }
                if (noddy && 'href' in noddy && noddy.href.indexOf('http') !== -1) {
                    // Ha belső link vagy Looker, engedjük az alapértelmezett megnyitást
                }
            }, false);
        }
    </script>
</body>
</html>
